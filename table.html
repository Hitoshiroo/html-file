<!DOCTYPE html>
<html>
  <head>
    <title>simple table</title>
  </head>
  <body align="center">
    <table border="1">
      <tr>
        <th>no</th>
        <th>type</th>
        <th>age</th>
        <th>alive/unalive</th>
      </tr>
      <tr>
        <td>1</td>
        <td>human</td>
        <td>110</td>
        <td>alive</td>
      </tr>
      <tr>
        <td>2</td>
        <td>elf</td>
        <td>1000</td>
        <td>alive</td>
      </tr>
      <tr>
        <td>3</td>
        <td>dwarf</td>
        <td>500</td>
        <td>alive</td>
      </tr>
      <tr>
        <td>4</td>
        <td>orc</td>
        <td>200</td>
        <td>alive</td>
      </tr>
    </table>
  </body>
</html>
